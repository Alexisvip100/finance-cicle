services:
  - type: web
    name: ciclos-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ciclos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: ciclos-db
    plan: free
    databaseName: ciclos
    user: ciclos
